networks:
  default:
    name: soc-net
    external: true

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    container_name: thehive-elasticsearch
    restart: unless-stopped
    mem_limit: 900m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    restart: unless-stopped
    mem_limit: 900m
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - "JVM_OPTS=-Xms512M -Xmx512M"
    command:
      - --secret
      - "REMPLACE_PAR_TON_SECRET_GENERE"
      - "--index-backend"
      - "elasticsearch"
      - "--es-hostnames"
      - "elasticsearch"
      - "--no-config-cortex"
    volumes:
      - thehivedata:/opt/thp/thehive/data

volumes:
  esdata:
  thehivedata: